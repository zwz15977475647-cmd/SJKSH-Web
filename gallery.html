<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成品展示 - 瓷韵千年</title>
    <meta name="description" content="欣赏青花瓷、青瓷、白瓷等中华陶瓷艺术珍品，感受泥土与火焰的完美结合">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clay: '#8B5A2B',
                        porcelain: '#F5F5F0',
                        glaze: '#4A90E2',
                        fire: '#E64A19',
                        earth: '#D2B48C',
                        ink: '#2C3E50'
                    },
                    fontFamily: {
                        serif: ['Georgia', 'Times New Roman', 'serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-porcelain text-ink font-sans pt-20">
    <!-- 导航栏 -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md shadow-sm py-4" id="navbar">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <i class="fa fa-fire text-fire text-2xl"></i>
                <h1 class="text-2xl font-serif font-bold text-clay">瓷韵千年</h1>
            </a>
            <div class="hidden md:flex space-x-8">
                <a href="index.html" class="nav-link hover:text-fire transition-colors">首页</a>
                <a href="process.html" class="nav-link hover:text-fire transition-colors">烧制流程</a>
                <a href="data.html" class="nav-link hover:text-fire transition-colors">数据统计</a>
                <a href="gallery.html" class="nav-link hover:text-fire transition-colors active">成品展示</a>
            </div>
            <button class="md:hidden text-ink text-xl" id="menuToggle"><i class="fa fa-bars"></i></button>
        </div>
    </nav>

    <!-- 移动端菜单 -->
    <div class="fixed inset-0 bg-black/50 z-40 hidden" id="mobileMenu">
        <div class="bg-white h-full w-64 p-6">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-xl font-serif font-bold text-clay">瓷韵千年</h2>
                <button id="closeMenu"><i class="fa fa-times text-xl"></i></button>
            </div>
            <div class="flex flex-col space-y-6">
                <a href="index.html" class="mobile-nav-link text-lg hover:text-fire transition-colors">首页</a>
                <a href="process.html" class="mobile-nav-link text-lg hover:text-fire transition-colors">烧制流程</a>
                <a href="data.html" class="mobile-nav-link text-lg hover:text-fire transition-colors">数据统计</a>
                <a href="gallery.html" class="mobile-nav-link text-lg hover:text-fire transition-colors active">成品展示</a>
            </div>
        </div>
    </div>

    <!-- 成品展示 -->
    <section class="py-20">
        <div class="container mx-auto px-6">
            <div class="text-center mb-16">
                <h2 class="text-[clamp(2rem,5vw,3.5rem)] font-serif font-bold text-clay mb-4">精美瓷器展示</h2>
                <p class="text-lg text-ink/70 max-w-2xl mx-auto">欣赏经过千锤百炼的陶瓷艺术珍品，感受泥土与火焰的完美结合</p>
            </div>

            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="gallery-item h-96">
                    <img src="https://picsum.photos/id/20/600/800" alt="青花瓷" class="w-full h-full object-cover">
                    <div class="gallery-overlay p-6">
                        <div>
                            <h3 class="text-xl font-bold text-white mb-2">青花瓷</h3>
                            <p class="text-white/80">元代首创，用钴料在白瓷胎上描绘纹饰，再罩透明釉，经高温还原焰一次烧成</p>
                        </div>
                    </div>
                </div>
                <div class="gallery-item h-96">
                    <img src="https://picsum.photos/id/21/600/800" alt="青瓷" class="w-full h-full object-cover">
                    <div class="gallery-overlay p-6">
                        <div>
                            <h3 class="text-xl font-bold text-white mb-2">青瓷</h3>
                            <p class="text-white/80">中国最古老的瓷器品种，釉面呈青绿色，如冰似玉，有"千峰翠色"之美誉</p>
                        </div>
                    </div>
                </div>
                <div class="gallery-item h-96">
                    <img src="https://picsum.photos/id/22/600/800" alt="白瓷" class="w-full h-full object-cover">
                    <div class="gallery-overlay p-6">
                        <div>
                            <h3 class="text-xl font-bold text-white mb-2">白瓷</h3>
                            <p class="text-white/80">胎质洁白细腻，釉色纯净莹润，是中国瓷器的主流品种之一</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="bg-ink text-white py-12">
        <div class="container mx-auto px-6">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="flex items-center space-x-2 mb-6 md:mb-0">
                    <i class="fa fa-fire text-fire text-2xl"></i>
                    <h2 class="text-2xl font-serif font-bold">瓷韵千年</h2>
                </div>
                <div class="flex space-x-6">
                    <a href="#" class="text-white/70 hover:text-white"><i class="fa fa-weibo text-xl"></i></a>
                    <a href="#" class="text-white/70 hover:text-white"><i class="fa fa-wechat text-xl"></i></a>
                    <a href="#" class="text-white/70 hover:text-white"><i class="fa fa-instagram text-xl"></i></a>
                </div>
            </div>
            <hr class="border-white/20 my-8">
            <div class="text-center text-white/50 text-sm">
                <p>©  2026 瓷韵千年 - 陶瓷烧制工艺交互展示平台. 保留所有权利.</p>
            </div>
        </div>
    </footer>

    <script>
        // 导航栏滚动
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('py-2', 'shadow-md');
                navbar.classList.remove('py-4', 'shadow-sm');
            } else {
                navbar.classList.add('py-4', 'shadow-sm');
                navbar.classList.remove('py-2', 'shadow-md');
            }
        });

        // 移动端菜单
        const menuToggle = document.getElementById('menuToggle');
        const closeMenuBtn = document.getElementById('closeMenu');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileNavLinks = document.querySelectorAll('.mobile-nav-link');

        function openMenu() { mobileMenu.classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
        function closeMenuFn() { mobileMenu.classList.add('hidden'); document.body.style.overflow = ''; }

        menuToggle.addEventListener('click', openMenu);
        closeMenuBtn.addEventListener('click', closeMenuFn);
        mobileMenu.addEventListener('click', function(e) { if (e.target === mobileMenu) closeMenuFn(); });
        mobileNavLinks.forEach(link => link.addEventListener('click', closeMenuFn));
    </script>
</body>
</html>
